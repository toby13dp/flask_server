<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Page Builder</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="builder.css" />
</head>
<body>
  <div id="builder">
    <header class="builder-topbar">
      <div class="d-flex align-items-center justify-content-between px-3 py-2">
        <div class="d-flex align-items-center gap-2">
          <span class="fw-semibold small text-uppercase text-muted">Page Builder</span>
          <span id="current-page-title" class="fw-semibold small">New page</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="btn-group btn-group-sm" role="group">
            <button type="button" class="btn btn-outline-secondary" id="btn-undo">Undo</button>
            <button type="button" class="btn btn-outline-secondary" id="btn-redo">Redo</button>
          </div>
          <div class="btn-group btn-group-sm" role="group">
            <button type="button" class="btn btn-outline-secondary" id="btn-preview">Preview</button>
            <button type="button" class="btn btn-primary" id="btn-save">Save</button>
          </div>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-export-json">
            Export JSON
          </button>
        </div>
      </div>
    </header>

    <section class="builder-canvas-shell">
      <div class="canvas-toolbar d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <div class="btn-group btn-group-sm" role="group" id="device-buttons">
            <button type="button" class="btn btn-outline-secondary active" data-device="desktop">Desktop</button>
            <button type="button" class="btn btn-outline-secondary" data-device="tablet">Tablet</button>
            <button type="button" class="btn btn-outline-secondary" data-device="mobile">Mobile</button>
          </div>
          <div class="ms-2 d-flex align-items-center gap-1">
            <label for="zoom-select" class="form-label mb-0 small text-muted">Zoom</label>
            <select id="zoom-select" class="form-select form-select-sm d-inline-block w-auto">
              <option value="50">50%</option>
              <option value="75">75%</option>
              <option value="100" selected>100%</option>
              <option value="125">125%</option>
            </select>
          </div>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="form-check form-switch form-switch-sm">
            <input class="form-check-input" type="checkbox" id="toggle-grid" />
            <label class="form-check-label small" for="toggle-grid">Grid</label>
          </div>
          <div class="form-check form-switch form-switch-sm">
            <input class="form-check-input" type="checkbox" id="toggle-dark" />
            <label class="form-check-label small" for="toggle-dark">Dark UI</label>
          </div>
        </div>
      </div>

      <div id="device-wrapper" class="device-desktop zoom-100">
        <div class="builder-canvas">
          <main id="sections-container" class="builder-sections empty"></main>
        </div>
      </div>
    </section>

    <aside class="builder-sidebar-right">
      <ul class="nav nav-tabs small px-2 pt-2" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="tab-elements-tab" data-bs-toggle="tab" data-bs-target="#tab-elements" type="button" role="tab">Elements</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-inspect-tab" data-bs-toggle="tab" data-bs-target="#tab-inspect" type="button" role="tab">Inspect</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-seo-tab" data-bs-toggle="tab" data-bs-target="#tab-seo" type="button" role="tab">SEO</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-theme-tab" data-bs-toggle="tab" data-bs-target="#tab-theme" type="button" role="tab">Theme</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-outline-tab" data-bs-toggle="tab" data-bs-target="#tab-outline" type="button" role="tab">Outline</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-pages-tab" data-bs-toggle="tab" data-bs-target="#tab-pages" type="button" role="tab">Pages</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-templates-tab" data-bs-toggle="tab" data-bs-target="#tab-templates" type="button" role="tab">Templates</button>
        </li>
      </ul>

      <div class="tab-content p-3 small">
        <div class="tab-pane fade show active" id="tab-elements" role="tabpanel">
          <div class="sidebar-section-title">Quick sections</div>
          <div id="palette" class="palette-grid mb-3"></div>
          <div class="sidebar-section-title">Widgets</div>
          <div id="widget-palette" class="palette-grid"></div>
        </div>

        <div class="tab-pane fade" id="tab-inspect" role="tabpanel">
          <div class="sidebar-section-title">Breadcrumb</div>
          <div id="inspector-breadcrumb" class="inspector-breadcrumb mb-2"></div>
          <div id="inspector-fields"></div>
        </div>

        <div class="tab-pane fade" id="tab-seo" role="tabpanel">
          <div class="mb-2">
            <label class="form-label">Page title</label>
            <input id="seo-title" class="form-control form-control-sm" />
          </div>
          <div class="mb-2">
            <label class="form-label">Slug</label>
            <input id="seo-slug" class="form-control form-control-sm" />
          </div>
          <div class="mb-2">
            <label class="form-label">Description</label>
            <textarea id="seo-description" class="form-control form-control-sm" rows="3"></textarea>
          </div>
          <div class="mb-2">
            <label class="form-label">Status</label>
            <select id="seo-status" class="form-select form-select-sm">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
            </select>
          </div>
        </div>

        <div class="tab-pane fade" id="tab-theme" role="tabpanel">
          <div class="sidebar-section-title">Theme</div>
          <div class="mb-2">
            <label class="form-label">Primary color</label>
            <input type="color" id="theme-primary" class="form-control form-control-color" value="#0d6efd" />
          </div>
          <div class="mb-2">
            <label class="form-label">Background</label>
            <input type="color" id="theme-background" class="form-control form-control-color" value="#f3f4f8" />
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="theme-rounded" checked />
            <label class="form-check-label" for="theme-rounded">Rounded corners</label>
          </div>
        </div>

        <div class="tab-pane fade" id="tab-outline" role="tabpanel">
          <div id="outline-tree" class="outline-tree"></div>
        </div>

        <div class="tab-pane fade" id="tab-pages" role="tabpanel">
          <div class="sidebar-section-title">Pages</div>
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span id="current-page-label" class="fw-semibold">n/a</span>
            <div class="btn-group btn-group-sm">
              <button type="button" class="btn btn-outline-secondary" id="btn-new-page">New</button>
              <button type="button" class="btn btn-outline-secondary" id="btn-dup-page">Duplicate</button>
              <button type="button" class="btn btn-outline-secondary" id="btn-del-page">Delete</button>
            </div>
          </div>
          <ul id="pages-list" class="list-group list-group-flush small"></ul>
          <p class="text-muted mt-2" style="font-size:0.8rem;">
            Pages are stored locally in your browser. Update title, slug and status via the SEO tab.
          </p>
        </div>

        <div class="tab-pane fade" id="tab-templates" role="tabpanel">
          <div class="sidebar-section-title">Templates</div>
          <button class="btn btn-outline-secondary btn-sm mb-2" id="btn-save-page-template">Save page as template</button>
          <button class="btn btn-outline-secondary btn-sm mb-2" id="btn-export-templates-json">Export templates</button>
          <div class="mb-2">
            <label class="form-label">Section templates</label>
            <div id="templates-sections-list" class="list-group list-group-flush small"></div>
          </div>
          <div class="mb-2">
            <label class="form-label">Page templates</label>
            <div id="templates-pages-list" class="list-group list-group-flush small"></div>
          </div>
          <p class="text-muted" style="font-size:0.8rem;">
            Select a section, open Inspect, and use "Save section as template".
          </p>
        </div>
      </div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="builder.js"></script>
</body>
</html>
